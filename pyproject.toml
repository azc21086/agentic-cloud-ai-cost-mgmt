[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcsi-governance"
version = "1.0.0"
description = "Reference implementation of a bounded-autonomy decision system for cloud financial governance (anomaly detection, LLM decision records, routing rule, simulation harness)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ankit Chopra" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
ui = ["gradio>=4.0"]
dev = ["pytest>=7"]
all = ["openai>=1.30", "gradio>=4.0", "pytest>=7"]

[project.scripts]
gcsi = "gcsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
